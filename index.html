<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="font-set.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png">
    <title>Colored Cipher Solver</title>
</head>
<body>
    <div class="palette">
        <div class="red cr">Red</div>
        <div class="orange co">Orange</div>
        <div class="yellow cy">Yellow</div>
        <div class="green cg">Green</div>
        <div class="blue cb">Blue</div>
        <div class="indigo ci">Indigo</div>
        <div class="violet cv">Violet</div>
        <div class="white cw">White</div>
        <div class="gray ca">Gray</div>
        <div class="black ck">Black</div>
    </div>
    <div class="module-container">
        <div class="edgework">
            <input type="text" id="ew1" autocomplete="off" placeholder="SN FIRST DIGIT">
            <input type="text" id="ew2" autocomplete="off" placeholder="SN SECOND DIGIT">
            <input type="text" id="ew3" autocomplete="off" placeholder="SN LAST DIGIT">
        </div>
        <div class="module">
            <div class="top-part">
                <div class="screens">
                    <div class="top screen">
                        <input type="text" class="t p1" id="t1" autocomplete="off">
                        <input type="text" class="t p2" id="t2" autocomplete="off">
                    </div>
                    <div class="middle screen">
                        <input type="text" class="m p1" id="m1" autocomplete="off">
                        <input type="text" class="m p2" id="m2" autocomplete="off">
                    </div>
                    <div class="bottom screen">
                        <input type="text" class="b p1" id="b1" autocomplete="off">
                        <input type="text" class="b p2" id="b2" autocomplete="off">
                        <div class="answer"></div>
                    </div>
                </div>
                <div class="right-part">
                    <div class="status-light-container">
                        <div class="status-light"></div>
                    </div>
                    <div class="arrows">
                        <div class="arrow arrow-left screen">
                            <input type="text" class="arrow-input" id="la" autocomplete="off">
                            <div class="arrow-text">&lt;</div>
                        </div>
                        <div class="arrow arrow-right screen">
                            <input type="text" class="arrow-input" id="ra" autocomplete="off">
                            <div class="arrow-text">&gt;</div>
                        </div>
                    </div>
                    <div class="submit screen">1</div>
                </div>
            </div>
            <div class="keyboard">Press the page screen to solve the module</div>
        </div>
        <div class="tips"></div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
