<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="palette">
        <div class="red">Red</div>
        <div class="orange">Orange</div>
        <div class="yellow">Yellow</div>
        <div class="green">Green</div>
        <div class="blue">Blue</div>
        <div class="indigo">Indigo</div>
        <div class="violet">Violet</div>
        <div class="white">White</div>
        <div class="gray">Gray</div>
        <div class="black">Black</div>
    </div>
    <div class="module-container">
        <div class="module">
            <div class="top-part">
                <div class="screens">
                    <div class="top">
                        <input type="text" class="t 1">
                        <input type="text" class="t 2">
                    </div>
                    <div class="middle">
                        <input type="text" class="m 1">
                        <input type="text" class="m 2">
                    </div>
                    <div class="bottom">
                        <input type="text" class="b 1">
                        <input type="text" class="b 2">
                    </div>
                </div>
                <div class="right-part">
                    <div class="status-light-container">
                        <div class="status-light"></div>
                    </div>
                    <div class="arrows">
                        <div class="left">

                        </div>
                        <div class="right">
                            
                        </div>
                    </div>
                    <div class="submit"></div>
                </div>
            </div>
            <div class="keyboard"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
